
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Kampus - Versi Perbaikan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 960px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }

        header,
        main,
        footer {
            margin-bottom: 24px;
        }

        section {
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input,
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        footer {
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Profil Kampus</h1>
        <p>Informasi kampus dan kegiatan mahasiswa.</p>
    </header>

    <main>
        <section id="about">
            <h2>Tentang Kampus</h2>
            <p>Kampus menyediakan lingkungan untuk belajar dan mengembangkan keterampilan mahasiswa.</p>
        </section>

        <section id="facilities">
            <h2>Fasilitas Kampus</h2>
            <img src="https://placehold.co/600x300?text=Fasilitas+Kampus" alt="Ilustrasi fasilitas kampus">
            <p>Fasilitas mendukung kegiatan belajar mahasiswa.</p>
        </section>

        <section id="contact">
            <h2>Hubungi Kami</h2>
            <form action="#" method="post">
                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="message">Pesan</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </p>
                <button type="submit">Kirim</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Profil Kampus</p>
    </footer>
</body>
</html>
